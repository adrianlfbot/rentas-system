apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rentas-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rentas-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rentas-backend
  template:
    metadata:
      labels:
        app: rentas-backend
    spec:
      containers:
      - name: rentas-backend
        image: rentas-backend:latest # Cambiar por tu registro real (ej: ghcr.io/adrianlfbot/rentas-backend)
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: DB_PATH
          value: "/data/rentas.db"
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        volumeMounts:
        - name: data-volume
          mountPath: /data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: rentas-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rentas-backend
spec:
  selector:
    app: rentas-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
